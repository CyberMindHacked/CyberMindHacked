<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Night Shift · CyberMindHacked</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1420;color:#eef4fc;font:17px/1.5 system-ui}main{max-width:780px;margin:auto;padding:clamp(18px,5vw,52px)}header{border-bottom:2px solid #81e8cf;padding-bottom:16px}small,summary,#counter{color:#86e8d0;font:600 14px/1.6 monospace}h1{font-size:clamp(44px,8vw,76px);letter-spacing:-.065em;margin:0}h2{line-height:1.15}details,button{background:#142537;border:1px solid #395269;border-radius:7px;padding:12px 16px;margin:7px 0}summary,button{cursor:pointer}button{display:block;text-align:left;color:inherit;font:inherit;width:100%}button:hover,button:focus-visible{border-color:#84efd9}button:disabled{opacity:.65;cursor:default}#feedback{border-left:3px solid #ffcc82;padding-left:14px}#advance{background:#8ce9d2;color:#10262a;width:auto;font-weight:700}section{margin-top:22px}</style><main><header><small>CYBERMINDHACKED / INCIDENT DESK</small><h1>Night Shift</h1>Inspect the evidence. Decide which alerts need action.</header><section id="desk"></section></main><script>
const cases=[["02:13","One account, two continents","A travel alert fired seven minutes after a successful office login.","Identity log","Same managed laptop and session ID on both events.","Network inventory","The second IP belongs to the corporate VPN exit.","Close as expected VPN activity","Revoke every session","Open a stolen-device incident",0,"The known VPN exit explains the location change. The device and session also match."],["02:41","A supplier changes banks","Finance received an urgent reply in an existing invoice thread.","Mail authentication","The message passed SPF and DKIM for the supplier’s domain.","Vendor record","The new bank details differ from the approved record. No change request is logged.","Approve the transfer","Hold payment and call the vendor using the number on file","Reply to the sender for confirmation",1,"A genuine mailbox can be compromised. Verify the requested change through an independently recorded contact."],["03:08","An export grows overnight","A service account read ten times its usual number of records.","Change calendar","An approved migration covers the same account, table and time window.","Storage audit","The export went to a public bucket. The approved target is private.","Close against the migration ticket","Delete all audit records","Restrict public access and investigate exposure",2,"The ticket explains the volume. It does not authorize a public destination. Preserve access logs to assess exposure."],["04:26","An unfamiliar mobile permission","A field worker reports a location prompt after an app update.","Release notes","Route capture is optional and should start only when the worker taps Start Route.","Device observation","The prompt appears on the sign-in screen before a route is selected.","Mark the app as confirmed spyware","Report the unexpected prompt and reproduce it on a test device","Approve location for every worker",1,"The timing contradicts the documented feature. That supports a privacy bug report, but does not establish malicious intent."]];
const desk=document.querySelector('#desk');
let index=0, decisions=[];
function render(){
 if(index===cases.length){
 const score=decisions.filter(Boolean).length;
 desk.innerHTML='<h2>Shift handover</h2><p>'+score+' / '+cases.length+' decisions matched the evidence.</p>'+cases.map((c,i)=>'<details><summary>'+(decisions[i]?'✓':'Review')+' · '+c[1]+'</summary><p>'+c[7+c[10]]+'</p><p>'+c[11]+'</p></details>').join('')+'<button id="advance">Restart shift</button>';
 desk.querySelector('button').onclick=()=>{index=0;decisions=[];render()};return;
 }
 const c=cases[index];
 desk.innerHTML='<p id="counter">'+c[0]+' / CASE '+(index+1)+' OF '+cases.length+'</p><h2>'+c[1]+'</h2><p>'+c[2]+'</p><h3>Evidence file</h3>'+[3,5].map(i=>'<details><summary>'+c[i]+'</summary><p>'+c[i+1]+'</p></details>').join('')+'<h3>Your decision</h3>'+c.slice(7,10).map((label,i)=>'<button data-choice="'+i+'">'+label+'</button>').join('')+'<div aria-live="polite" id="result"></div>';
 desk.querySelectorAll('[data-choice]').forEach(button=>button.onclick=()=>{
 const correct=Number(button.dataset.choice)===c[10];decisions.push(correct);
 desk.querySelectorAll('[data-choice]').forEach(b=>b.disabled=true);
 desk.querySelector('#result').innerHTML='<p id="feedback"><strong>'+(correct?'Supported by the evidence.':'Review the evidence.')+'</strong> '+c[11]+'</p><button id="advance">'+(index===cases.length-1?'View handover':'Next case')+'</button>';
 desk.querySelector('#advance').onclick=()=>{index++;render()};
 });
}
render();</script></html>
