<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Night Shift — Incident Desk</title><style>*{box-sizing:border-box}body{margin:0;background:#0c1118;color:#e3eaf1;font:16px/1.5 system-ui}header,main{max-width:1200px;margin:auto;padding:24px 5%}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #36414e}header strong{color:#b9ff80;letter-spacing:.12em;font:700 15px monospace}a{color:#b9ff80}h1{font-size:clamp(48px,7vw,92px);letter-spacing:-.07em;line-height:1;margin:18px 0}h2{font-size:clamp(26px,4vw,42px);line-height:1.1;letter-spacing:-.04em}small,summary{font:600 14px monospace;color:#c4f4a9}.layout{display:grid;grid-template-columns:minmax(190px,1fr) 2.3fr;gap:18px;margin:24px 0}aside,article{border:1px solid #36414e;border-radius:14px;padding:clamp(14px,3vw,28px);background:#141c26}button{display:block;background:#202d39;color:inherit;border:1px solid #415363;border-radius:7px;padding:13px;text-align:left;width:100%;font:inherit;margin:8px 0;cursor:pointer}button:hover,button:focus-visible,button[aria-current=true]{border-color:#b9ff80;background:#27382e}button:disabled{opacity:.55}summary{cursor:pointer;padding:12px 0}details{border-bottom:1px solid #354456}progress{width:100%;accent-color:#b9ff80}#result{color:#d6edbd}#next{color:#101b0a;background:#b9ff80;font-weight:650}@media(max-width:670px){.layout{display:flex;flex-direction:column}aside nav{display:flex;gap:4px;overflow:auto}aside nav button{min-width:115px;font-size:13px}}</style><header><strong>◈ CYBERMINDHACKED</strong><a href="https://github.com/CyberMindHacked">GitHub ↗</a></header><main><h1>Night Shift<span style="color:#b9ff80">.</span></h1><p>Triage four fictional incidents. Inspect the records, choose a response and review your shift.</p><div class="layout"><aside><small>INCIDENT QUEUE</small><nav></nav><progress max="4" value="0"></progress><div id="status"></div></aside><article id="panel" aria-live="polite"></article></div></main><script>
const cases=[["02:13","One account, two continents","A travel alert fired seven minutes after a successful office login.","Identity log","Same managed laptop and session ID on both events.","Network inventory","The second IP belongs to the corporate VPN exit.","Close as expected VPN activity","Revoke every session","Open a stolen-device incident",0,"The known VPN exit explains the location change. The device and session also match."],["02:41","A supplier changes banks","Finance received an urgent reply in an existing invoice thread.","Mail authentication","The message passed SPF and DKIM for the supplier’s domain.","Vendor record","The new bank details differ from the approved record. No change request is logged.","Approve the transfer","Hold payment and call the vendor using the number on file","Reply to the sender for confirmation",1,"A genuine mailbox can be compromised. Verify the requested change through an independently recorded contact."],["03:08","An export grows overnight","A service account read ten times its usual number of records.","Change calendar","An approved migration covers the same account, table and time window.","Storage audit","The export went to a public bucket. The approved target is private.","Close against the migration ticket","Delete all audit records","Restrict public access and investigate exposure",2,"The ticket explains the volume. It does not authorize a public destination. Preserve access logs to assess exposure."],["04:26","An unfamiliar mobile permission","A field worker reports a location prompt after an app update.","Release notes","Route capture is optional and should start only when the worker taps Start Route.","Device observation","The prompt appears on the sign-in screen before a route is selected.","Mark the app as confirmed spyware","Report the unexpected prompt and reproduce it on a test device","Approve location for every worker",1,"The timing contradicts the documented feature. That supports a privacy bug report, but does not establish malicious intent."]];
let picks=Array(4).fill(null);try{const saved=JSON.parse(localStorage.getItem('night-shift-v1'));if(Array.isArray(saved)&&saved.length===4&&saved.every(x=>x===null||[0,1,2].includes(x)))picks=saved}catch{}
let active=picks.findIndex(x=>x===null);const panel=document.querySelector('article');
function save(){try{localStorage.setItem('night-shift-v1',JSON.stringify(picks))}catch{}}
function draw(){const done=picks.filter(x=>x!==null).length;document.querySelector('progress').value=done;document.querySelector('#status').textContent=done+' of 4 resolved';const nav=document.querySelector('nav');nav.replaceChildren();cases.forEach((c,i)=>{let b=document.createElement('button');b.textContent=(picks[i]===null?'○ ':'✓ ')+c[0]+' · '+['Identity','Finance','Storage','Mobile'][i];b.setAttribute('aria-current',active===i);b.onclick=()=>{active=i;draw()};nav.append(b)});
if(active<0){panel.innerHTML='<small>SHIFT HANDOVER</small><h2>'+picks.filter((v,i)=>v===cases[i][10]).length+' / 4 supported decisions</h2>'+cases.map((c,i)=>'<details><summary>'+c[1]+'</summary><p>Your call: '+c[7+picks[i]]+'</p><p>'+c[11]+'</p></details>').join('')+'<button id="next">Start another shift</button>';panel.querySelector('button').onclick=()=>{picks.fill(null);save();active=0;draw()};return}
const c=cases[active],choice=picks[active];panel.innerHTML='<small>'+c[0]+' / INCIDENT FILE</small><h2>'+c[1]+'</h2><p>'+c[2]+'</p><h3>Evidence</h3>'+[3,5].map(i=>'<details><summary>'+c[i]+'</summary><p>'+c[i+1]+'</p></details>').join('')+'<h3>Your response</h3>'+c.slice(7,10).map((v,i)=>'<button data-i="'+i+'" '+(choice!==null?'disabled':'')+'>'+(choice===i?'✓ ':'')+v+'</button>').join('');panel.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{picks[active]=Number(b.dataset.i);save();draw()});if(choice!==null){panel.insertAdjacentHTML('beforeend','<p id="result"><b>'+(choice===c[10]?'Supported decision.':'Review your call.')+'</b> '+c[11]+'</p><button id="next">'+(done===4?'Review shift':'Next unresolved incident')+'</button>');panel.querySelector('#next').onclick=()=>{active=picks.indexOf(null);draw()}}}draw();</script></html>
